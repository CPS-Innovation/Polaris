# Override: the NEXT config with its switches as DEPLOYED, not as the parity run has them.
#
#   docker compose -f docker-compose.yml -f docker-compose.next.yml -f docker-compose.switches-on.yml up
#   ../run-tests.sh --next            (runs the next config twice: switches off, then on)
#
# cmsproxy.mock.env keeps every switch OFF, so the --next pass proves the next config behaves
# exactly as the live monolith. But what ships has NON_DDEI_INIT_ENABLED=true in pre-prod
# (terraform var.non_ddei_init_enabled), so /auth-refresh-inbound, termination, cms-modern-token
# and dev-login are answered in njs (drop1, dev-login) instead of the DDEI mock. This second pass runs the same suite that way. drop2 stays off: it
# needs Entra, which the mock does not play (its callback is covered by unit tests).
# `environment` entries here override the same keys from the base stack's env_file.
services:
  nginx:
    environment:
      - NON_DDEI_INIT_ENABLED=true
