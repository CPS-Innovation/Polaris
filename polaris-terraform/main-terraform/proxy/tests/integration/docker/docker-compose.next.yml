# Override: run the SAME integration tests against the "next" (to-be, refactored)
# config in ../../../config/ instead of the live config in main-terraform/.
#
#   docker compose -f docker-compose.yml -f docker-compose.next.yml up
#   ../run-tests.sh --next
#
# Docker Compose merges `volumes` BY TARGET: a mount here with the same container
# path as one in docker-compose.yml REPLACES it (verified). So this file only has
# to repoint the config sources — everything else in the base stack (ports, the
# env manifest, the mock upstream and its network aliases) is inherited unchanged.
#
# The two configs are exercised by the identical test suite; green on both proves
# the refactor changed no behaviour. See proxy/config/README.md and docs/PROXY.md §6/§7.
#
# WHILE MIGRATING: as nginx.conf in proxy/config/ is sliced into features/*.conf,
# add a mount line per feature file here, e.g.
#   - ../../../config/features/<name>.conf:/etc/nginx/templates/features/<name>.conf.template:ro
# (each .conf needs its own line with the .template suffix — envsubst only renders
#  *.template, and a directory cannot be bulk-mounted through that rename.) Add
#  common.js the same way. Repoint or drop the nginx.js/cmsenv.js lines below as
#  their logic moves into the new modules.

services:
  nginx:
    volumes:
      # ../../../config == polaris-terraform/main-terraform/proxy/config/
      - ../../../config/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
      - ../../../config/cmsenv.js:/etc/nginx/templates/cmsenv.js:ro
      - ../../../config/polaris-script.js:/etc/nginx/templates/polaris-script.js:ro
      # auth-handover.js: owned by auth-handover.conf, sits beside it in features/
      - ../../../config/features/auth-handover.js:/etc/nginx/features/auth-handover.js:ro
      # global-components now lives under features/: the .conf renders into
      # /etc/nginx/features/ (picked up by `include features/*.conf;`) and the .js
      # sits beside it (js_import gloco from features/global-components.js).
      - ../../../config/features/global-components.conf:/etc/nginx/templates/features/global-components.conf.template:ro
      - ../../../config/features/global-components.js:/etc/nginx/features/global-components.js:ro
      # --- sliced feature includes (each .conf -> .conf.template) ---
      # Plain descriptive names, no numeric prefixes: include order is
      # behaviourally irrelevant (no cross-file regex collisions — all CMS regexes
      # are co-located in cms-proxy.conf). Feature 0 / health stays inline.
      - ../../../config/features/app-launch.conf:/etc/nginx/templates/features/app-launch.conf.template:ro
      - ../../../config/features/auth-handover.conf:/etc/nginx/templates/features/auth-handover.conf.template:ro
      # rcms (navigate-cms) folded into global-components.conf
      - ../../../config/features/cwa-materials.conf:/etc/nginx/templates/features/cwa-materials.conf.template:ro
      - ../../../config/features/cms-proxy.conf:/etc/nginx/templates/features/cms-proxy.conf.template:ro
      - ../../../config/features/polaris-ddei.conf:/etc/nginx/templates/features/polaris-ddei.conf.template:ro
