# Feature 2 🤝 — auth handover
#
# /init /polaris /auth-refresh-* + dev-login. Owns its njs module, co-located and
# named to match (was the shared nginx.js). js_import resolves relative to the
# nginx prefix, so `templates/features/auth-handover/auth-handover.js` -> /etc/nginx/templates/
# features/auth-handover/auth-handover.js — where the deployed blob mount puts the .js (see
# app-service-proxy.tf); the same convention the live config uses for cmsenv.js.
# (dev-login's cookie handling — authHandover.devLogin — also lives in that
# module; it imports common/cmsenv.js for CMS-env detection.)
js_import authHandover from templates/features/auth-handover/auth-handover.js;

# The drop1 switch ("true"/"false"), read per request by every DDEI-backed location below:
# switch on -> answered in njs, no DDEI call. replaceDdei is imported by drop1's own .conf.
js_set $non_ddei replaceDdei.enabled;

location /auth-refresh-outbound {
  js_content authHandover.handleAuthRefreshOutbound;
}

location /polaris {
  # IE-mode coercion (IE Mode Desired) is now in polarisAuthRedirect via ieMode.coerce.
  js_var $redirectHostAddress ${ENDPOINT_HTTP_PROTOCOL}://$host;
  js_content authHandover.polarisAuthRedirect;
}

location /init {
  # Edge-mode coercion (Edge Mode Desired) is now in appAuthRedirect via ieMode.coerce.
  # drop2 (R0): with ENTRA_STORE_ENABLED (or a drop2 enrolment) appAuthRedirect looks the CMS
  # session up and starts the silent Entra round trip here, for EVERY destination — resolver +
  # js_fetch_verify off are for those $host CMS loopbacks (as /auth-refresh-inbound's drop1).
  # js_fetch_timeout bounds each CMS call, not the whole lookup (up to 3 calls, so ~30s worst
  # case; njs default 60s each): a slow CMS skips drop2 — /init carries on as today — instead of
  # stalling every app's handover. Unused when off.
  # The callback is the exact-match `location = /init/entra-callback` (drop2's .conf), which
  # wins over this prefix.
  resolver ${WEBSITE_DNS_SERVER} ipv6=off valid=30s;
  js_fetch_verify off;
  js_fetch_timeout 10s;
  js_content authHandover.appAuthRedirect;
}

location /auth-refresh-inbound {
  # Routing gate. Each `if` + `rewrite ... last` is the safe use of `if`; the first match
  # restarts location matching, so at most one fires. Every handover flow funnels through
  # here, so these gates flip them all. The query (polaris-ui-url / q / referer / cc) is
  # preserved across the internal rewrite.
  #
  # The switch is replaceDdei.enabled (drop1's module): true for ENTRA_STORE_ENABLED |
  # NON_DDEI_INIT_ENABLED, or a polaris_auth_handover = drop1 | drop2 enrolment cookie (the
  # per-user canary, set via /auth-refresh-enrol) -> /init-non-ddei (drop1: the DDEI /api/init/
  # njs reimpl). Off -> proxy DDEI /api/init/ exactly as today.
  # drop2 (Entra + MDS deposit) no longer lives here: it runs in /init for every destination
  # (R0). An Entra switch or drop2 enrolment means drop1 here; drop1 then uses the
  # CMS token /init passes on rather than looking it up again.
  # Read via njs/process.env (NOT conf-side `${...}` envsubst): at request time, so a MISSING
  # app setting reads "false" (feature off) instead of leaving an unresolved token that kills
  # nginx at boot. $non_ddei is set at the top of this file and fronts every DDEI-backed route.
  if ($non_ddei = "true") {
    rewrite ^/auth-refresh-inbound /init-non-ddei last;
  }
  proxy_pass ${ENDPOINT_HTTP_PROTOCOL}://${AUTH_HANDOVER_ENDPOINT_DOMAIN_NAME}/api/init/;
}

location = /auth-refresh-enrol {
  # Per-user enrolment page (canary): sets/clears the polaris_auth_handover cookie the
  # gate above reads. Plain GET page — inherits the server security headers (no add_header).
  js_content authHandover.enrol;
}

location /auth-refresh-termination {
  # Switch on: answered in njs (drop1). Off: DDEI's endpoint, as today.
  if ($non_ddei = "true") {
    rewrite ^ /auth-refresh-termination-non-ddei last;
  }
  proxy_pass ${ENDPOINT_HTTP_PROTOCOL}://${AUTH_HANDOVER_ENDPOINT_DOMAIN_NAME}/api/auth-refresh-termination/;
}

location /auth-refresh-cms-modern-token {
  # Switch on: answered in njs (drop1). Off: DDEI's endpoint, as today. Only reached when /init
  # passed no token on (drop2 off or skipped): global-components' OutSystems handover bounces here.
  if ($non_ddei = "true") {
    rewrite ^ /auth-refresh-cms-modern-token-non-ddei last;
  }
  proxy_pass ${ENDPOINT_HTTP_PROTOCOL}://${AUTH_HANDOVER_ENDPOINT_DOMAIN_NAME}/api/cms-modern-token/;
}

# Both dev-login locations differ only in their proxy_pass target; the cookie
# handling (GET clears the env + BIG-IP/LB cookies, POST stamps __CMSENV) is one
# method-branching js_header_filter in auth-handover.js. Switch on: both are answered in njs
# instead (feature dev-login), with no DDEI call.
location /dev-login/ {
    if ($non_ddei = "true") {
      rewrite ^ /dev-login-non-ddei last;
    }
    js_header_filter authHandover.devLogin;
    proxy_pass ${ENDPOINT_HTTP_PROTOCOL}://${DDEI_ENDPOINT_DOMAIN_NAME}/api/login?code=${DDEI_ENDPOINT_FUNCTION_APP_KEY};
}

location /api/dev-login-full-cookie/ {
    if ($non_ddei = "true") {
      rewrite ^ /dev-login-full-cookie-non-ddei last;
    }
    js_header_filter authHandover.devLogin;
    proxy_pass ${ENDPOINT_HTTP_PROTOCOL}://${DDEI_ENDPOINT_DOMAIN_NAME}/api/login-full-cookie?code=${DDEI_ENDPOINT_FUNCTION_APP_KEY};
}
