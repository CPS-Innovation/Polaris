# Feature 2 🤝 — auth handover
#
# /init /polaris /auth-refresh-* + dev-login. Owns its njs module, co-located and
# named to match (was the shared nginx.js). js_import resolves relative to the
# nginx prefix, so `templates/features/auth-handover/auth-handover.js` -> /etc/nginx/templates/
# features/auth-handover.js — where the deployed blob mount puts the .js (see
# app-service-proxy.tf); the same convention the live config uses for cmsenv.js.
# (dev-login's cookie handling — authHandover.devLogin — also lives in that
# module; it imports common.cms-detection for CMS-env detection.)
js_import authHandover from templates/features/auth-handover/auth-handover.js;

location /auth-refresh-outbound {
  js_content authHandover.handleAuthRefreshOutbound;
}

location /polaris {
  # IE-mode coercion (IE Mode Desired) is now in polarisAuthRedirect via ieMode.coerce.
  js_var $redirectHostAddress ${ENDPOINT_HTTP_PROTOCOL}://$host;
  js_content authHandover.polarisAuthRedirect;
}

location /init {
  # Edge-mode coercion (Edge Mode Desired) is now in appAuthRedirect via ieMode.coerce.
  js_content authHandover.appAuthRedirect;
}

location /auth-refresh-inbound {
  # Routing gate. Each `if` + `rewrite ... last` is the safe use of `if`; the first match
  # restarts location matching, so at most one fires. Every handover flow funnels through
  # here, so these gates flip them all. The query (polaris-ui-url / q / referer / cc) is
  # preserved across the internal rewrite.
  #
  # Precedence, highest first:
  #   1-2. polaris_auth_handover cookie = drop2 | drop1  — PER-USER enrolment (canary),
  #        set via /auth-refresh-enrol; lets an individual opt in ahead of the org rollout.
  #   3.   ENTRA_STORE_ENABLED   -> /init-entra    (drop2: runs drop1's establish, then the
  #                                                 Entra round-trip + store deposit)
  #   4.   NON_DDEI_INIT_ENABLED -> /init-non-ddei (drop1: the DDEI /api/init/ njs reimpl)
  #   5.   none                  -> proxy DDEI /api/init/ exactly as today
  # The cookie wins over the globals; remove it (Reset on the enrol page) to fall back to
  # them. drop2 wins over drop1 at each level (ENTRA precedence).
  if ($cookie_polaris_auth_handover = "drop2") {
    rewrite ^/auth-refresh-inbound /init-entra last;
  }
  if ($cookie_polaris_auth_handover = "drop1") {
    rewrite ^/auth-refresh-inbound /init-non-ddei last;
  }
  set $entra_store "${ENTRA_STORE_ENABLED}";
  set $non_ddei_init "${NON_DDEI_INIT_ENABLED}";
  if ($entra_store = "true") {
    rewrite ^/auth-refresh-inbound /init-entra last;
  }
  if ($non_ddei_init = "true") {
    rewrite ^/auth-refresh-inbound /init-non-ddei last;
  }
  proxy_pass ${ENDPOINT_HTTP_PROTOCOL}://${AUTH_HANDOVER_ENDPOINT_DOMAIN_NAME}/api/init/;
}

location = /auth-refresh-enrol {
  # Per-user enrolment page (canary): sets/clears the polaris_auth_handover cookie the
  # gate above reads. Plain GET page — inherits the server security headers (no add_header).
  js_content authHandover.enrol;
}

location /auth-refresh-termination {
  # This logic is simple enough to be handled by a response served directly from nginx.  However, for local development we are 
  #  using the /auth-refresh-termination endpoint of DDEI. So lets keep things unified and proxy to that until there is a real
  #  need to have an nginx-only approach here.
  proxy_pass ${ENDPOINT_HTTP_PROTOCOL}://${AUTH_HANDOVER_ENDPOINT_DOMAIN_NAME}/api/auth-refresh-termination/;
}

location /auth-refresh-cms-modern-token {
  proxy_pass ${ENDPOINT_HTTP_PROTOCOL}://${AUTH_HANDOVER_ENDPOINT_DOMAIN_NAME}/api/cms-modern-token/;
}

# Both dev-login locations differ only in their proxy_pass target; the cookie
# handling (GET clears the env + BIG-IP/LB cookies, POST stamps __CMSENV) is one
# method-branching js_header_filter in auth-handover.js.
location /dev-login/ {
    js_header_filter authHandover.devLogin;
    proxy_pass ${ENDPOINT_HTTP_PROTOCOL}://${DDEI_ENDPOINT_DOMAIN_NAME}/api/login?code=${DDEI_ENDPOINT_FUNCTION_APP_KEY};
}

location /api/dev-login-full-cookie/ {
    js_header_filter authHandover.devLogin;
    proxy_pass ${ENDPOINT_HTTP_PROTOCOL}://${DDEI_ENDPOINT_DOMAIN_NAME}/api/login-full-cookie?code=${DDEI_ENDPOINT_FUNCTION_APP_KEY};
}
