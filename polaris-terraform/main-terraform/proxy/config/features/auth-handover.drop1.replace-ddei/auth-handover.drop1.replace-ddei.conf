# Feature — non-DDEI init  (switch-gated, isolated new-gen functionality)
#
# The reworked /init: DDEI's /api/init/ done entirely in njs
# (auth-handover.drop1.replace-ddei.js). Reached ONLY via an internal rewrite from
# /auth-refresh-inbound, when NON_DDEI_INIT_ENABLED=true OR ENTRA_STORE_ENABLED=true OR the
# browser carries a polaris_auth_handover=drop1|drop2 enrolment cookie — the gate lives in
# auth-handover.conf. The source's /polaris-non-ddei sideways entry is deliberately NOT
# brought across: the existing /polaris -> /init entry is reused, and the switch flips
# only the terminal init step (every handover flow funnels through /auth-refresh-inbound,
# so one gate flips them all).
#
# NOT part of the golden-master before/after (docs/PLAN.md): dormant with the switch
# off, so --next stays behaviour-identical to the live monolith. Self-contained (its
# own njs, no shared imports) so it — and polaris-ddei with it — can be deleted cleanly.
js_import replaceDdei from templates/features/auth-handover.drop1.replace-ddei/auth-handover.drop1.replace-ddei.js;

location = /init-non-ddei {
  internal;                                            # only reachable via the internal rewrite
  resolver ${WEBSITE_DNS_SERVER} ipv6=off valid=30s;   # for the ngx.fetch $host loopbacks
  js_fetch_verify off;                                 # the loopback fetch carries a spoofed UA
  js_content replaceDdei.handleInitNonDdei;
}
