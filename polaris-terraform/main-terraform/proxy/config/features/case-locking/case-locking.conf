# Feature — case-locking (SignalR presence proxy for CMS case-locking).
#
# Ported from global-components infra/proxy/config/global-components.case-locking. Proxies
# the SignalR presence hub + its Azure SignalR Service same-origin, plus the case-locking
# static assets from blob storage. The negotiate response is rewritten by the js filters
# (case-locking.js) so the client connects back through us rather than to *.service.signalr.net.
#
# NEW-GEN: these routes do not exist in the live monolith. They add new paths only (all under
# /global-components/case-locking/), so they are outside the golden master and touch no
# existing route. Included alphabetically BEFORE global-components.conf; the prefixes are
# disjoint from that file's /global-components/(api|dev|test|prod|state|analytics)/ regexes,
# so cross-file ordering is safe.
#
# FEATURE DEPENDENCY: uses $cors_origin, which is js_set in features/global-components (
# `js_set $cors_origin gloco.readCorsOrigin`). This feature only READS it (a variable may be
# js_set only once per server), so global-components must be present. See QUIRKS.md.
js_import caseLocking from templates/features/case-locking/case-locking.js;

# Proxy Azure SignalR Service (path injected by filterNegotiateBody so the client connects
# same-origin instead of cross-origin to *.service.signalr.net). MUST come BEFORE the
# /api/(.*) block below so this more-specific regex wins.
location ~ ^/global-components/case-locking/api/sr/(.*)$ {
  error_page 418 = @gloco_preflight_case_locking;
  if ($request_method = OPTIONS) {
    return 418;
  }

  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;
  add_header Access-Control-Allow-Origin $cors_origin always;
  add_header Access-Control-Allow-Credentials true always;

  resolver ${WEBSITE_DNS_SERVER} ipv6=off valid=30s;
  proxy_ssl_server_name on;
  proxy_ssl_verify off;
  proxy_set_header Host sr-cms-presence.service.signalr.net;

  # Inline the $connection_upgrade map so we don't have to add it to the shared main
  # nginx.conf. `if` + `set` is the documented escape hatch when `map` (http-context
  # only) isn't available.
  set $connection_upgrade "";
  if ($http_upgrade) {
    set $connection_upgrade "upgrade";
  }
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  proxy_pass https://sr-cms-presence.service.signalr.net/$1$is_args$args;
}

# Proxy SignalR presence hub for case-locking (WebSocket-capable). The negotiate response
# is rewritten via js_body_filter to redirect the client at our same-origin /api/sr/ path
# instead of *.service.signalr.net.
location ~ ^/global-components/case-locking/api/(.*)$ {
  error_page 418 = @gloco_preflight_case_locking;
  if ($request_method = OPTIONS) {
    return 418;
  }

  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;
  add_header Access-Control-Allow-Origin $cors_origin always;
  add_header Access-Control-Allow-Credentials true always;

  resolver ${WEBSITE_DNS_SERVER} ipv6=off valid=30s;
  proxy_ssl_server_name on;
  proxy_ssl_verify off;
  proxy_set_header Host app-cms-presence-api.azurewebsites.net;
  proxy_set_header Accept-Encoding "";  # disable upstream compression for the body filter

  set $connection_upgrade "";
  if ($http_upgrade) {
    set $connection_upgrade "upgrade";
  }
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  proxy_pass https://app-cms-presence-api.azurewebsites.net/$1$is_args$args;

  js_header_filter caseLocking.dropContentLengthForNegotiate;
  js_body_filter caseLocking.filterNegotiateBody buffer_type=string;
}

# Proxy case-locking static assets from blob storage (dev/test/prod environments).
location ~ ^/global-components/case-locking/(dev|test|prod)/(.*)$ {
  error_page 418 = @gloco_preflight_case_locking;
  if ($request_method = OPTIONS) {
    return 418;
  }
  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;
  add_header Access-Control-Allow-Origin * always;
  resolver ${WEBSITE_DNS_SERVER} ipv6=off valid=30s;
  proxy_ssl_server_name on;
  proxy_ssl_verify off;
  proxy_pass_request_headers off;
  proxy_set_header Host ${CPS_GLOBAL_COMPONENTS_BLOB_STORAGE_DOMAIN};
  proxy_pass https://${CPS_GLOBAL_COMPONENTS_BLOB_STORAGE_DOMAIN}/case-locking/$1/$2;
}

# ---------------------------------------------------------------------------
# CMS presence API — same-origin proxy for the presence relay (transport #1).
#
# The presence relay (cms-presence-relay.html, an app-side asset) makes the session /
# heartbeat / poll calls to the presence API. The CMS page can't call cross-origin (IE
# Internet-zone "Access data sources across domains" = Prompt), so the relay — same-origin
# with this route — does it. Clean 1:1 mapping:
#     /global-components/presence/<X>  ->  app-cms-presence-api  /api/<X>
#
# NB: proxy_pass has NO variable, so nginx resolves the host at LOAD time via the SYSTEM
# resolver (/etc/resolv.conf -> 127.0.0.11), which returns the private-endpoint IP. A
# runtime `resolver ${WEBSITE_DNS_SERVER}` NXDOMAINs on the privatelink name and 502s — do
# NOT add one here (this deliberately differs from the case-locking /api block above, which
# uses a runtime resolver; see QUIRKS CL6). The rewrite maps the path; the query string is
# preserved. Authorization header + method pass through by nginx default (same-origin).
location ~ ^/global-components/presence/(.*)$ {
  proxy_ssl_server_name on;
  proxy_ssl_verify off;
  proxy_set_header Host app-cms-presence-api.azurewebsites.net;
  proxy_set_header Accept-Encoding "";
  rewrite ^/global-components/presence/(.*)$ /api/$1 break;
  proxy_pass https://app-cms-presence-api.azurewebsites.net;
}

# CMS presence API — JSONP adapter (transport #2, parallel to the relay proxy above).
#
# The injected CMS client can't XHR cross-origin (IE zone) but CAN load a <script src>
# cross-origin. So it fetches presence via JSONP and handlePresenceJsonp shims each GET
# into the backend's real POST/PUT/GET/DELETE, lifts the id-token from the HttpOnly
# cms-auth-id-token cookie (set by auth-handover.drop2.entra) into an Authorization header
# (token never in the URL), and wraps the JSON as callback(...). House pattern: server
# resolver + js_fetch_verify off + ngx.fetch.
location = /global-components/presence-jsonp {
  resolver ${WEBSITE_DNS_SERVER} ipv6=off valid=30s;
  js_fetch_verify off;
  js_content caseLocking.handlePresenceJsonp;
}

# Feature-local preflight handler. Mirrors the shared @gloco_preflight in
# features/global-components but adds X-Requested-With and X-SignalR-User-Agent to the
# allow-headers list (both sent by the SignalR client on negotiate POSTs). Kept feature-
# local (rather than widening the shared handler) so this feature stays self-contained and
# removable — see QUIRKS.md.
location @gloco_preflight_case_locking {
  internal;
  add_header Access-Control-Allow-Origin $cors_origin;
  add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
  add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Correlation-Id, X-Application, Cms-Auth-Values, X-Requested-With, X-SignalR-User-Agent';
  add_header Access-Control-Allow-Credentials true;
  add_header Access-Control-Max-Age 86400;
  add_header Content-Length 0;
  add_header Content-Type 'text/plain';
  return 204;
}
