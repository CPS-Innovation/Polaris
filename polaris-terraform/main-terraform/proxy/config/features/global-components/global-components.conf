# Moved into features/ (docs/PROXY.md §6). njs resolves js_import relative to the
# nginx prefix (/etc/nginx), so `templates/features/global-components/global-components.js` ->
# /etc/nginx/templates/features/global-components/global-components.js — where the deployed blob
# mount puts the .js (rendered .conf files land in /etc/nginx/features/).
js_import gloco from templates/features/global-components/global-components.js;

# Dynamic values from request headers/cookies (set by njs)
js_set $cms_auth_values gloco.readCmsAuthValues;
js_set $cors_origin gloco.readCorsOrigin;

# Return which cin/cms environment we are connected to, and whether proxied
location = /global-components/cms-session-hint {
  # This error_page 418 construct is a recommended way of dealing with 
  # OPTIONS without falling into any "nginx if is evil" traps. It ensures
  # execution/config is separated cleanly between OPTIONS and other VERBS.
  error_page 418 = @gloco_preflight;
  if ($request_method = OPTIONS) {
    return 418;
  }
  add_header Access-Control-Allow-Origin $cors_origin always;
  add_header Access-Control-Allow-Credentials true always;

  js_content gloco.handleSessionHint;
}

# Data interaction with MDS - the full proxied API surface
location ~ ^/global-components/api/(.*)$ {
  error_page 418 = @gloco_preflight;
  if ($request_method = OPTIONS) {
    return 418;
  }

  # Strip any CORS headers the upstream added so the browser only sees ours
  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;

  add_header Access-Control-Allow-Origin $cors_origin always;
  add_header Access-Control-Allow-Credentials true always;

  # Check AD token against MS graphql if required, see vnext config
  #auth_request /global-components/validate-token;

  proxy_set_header Origin "https://${host}"; # Prevent upstream CORS checks blocking us
  proxy_set_header x-functions-key "${WM_MDS_ACCESS_KEY}";
  proxy_set_header cms-auth-values $cms_auth_values;
  proxy_set_header Authorization ""; # Strip Authorization header, upstream does not want it
  proxy_pass ${WM_MDS_BASE_URL}$1$is_args$args;
}

# Legacy route for clients with cookies on /api/ path - rewrites to /global-components/api/*
location ~ ^/api/global-components/(.*)$ {
  rewrite ^/api/global-components/(.*)$ /global-components/api/$1 last;
}

# Proxy static assets from blob storage (dev/test/prod environments)
location ~ ^/global-components/(dev|test|uat|prod)/(.*)$ {
  error_page 418 = @gloco_preflight;
  if ($request_method = OPTIONS) {
    return 418;
  }

  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;
  add_header Access-Control-Allow-Origin * always;

  resolver ${WEBSITE_DNS_SERVER} ipv6=off valid=30s;
  proxy_ssl_server_name on;
  proxy_ssl_verify off;
  proxy_pass_request_headers off;
  proxy_set_header Host ${CPS_GLOBAL_COMPONENTS_BLOB_STORAGE_DOMAIN};
  proxy_pass https://${CPS_GLOBAL_COMPONENTS_BLOB_STORAGE_DOMAIN}/$1/$2;
}

# State kept in cookies e.g. preview settings
location ~ ^/global-components/state/(.*)$ {
  error_page 418 = @gloco_preflight;
  if ($request_method = OPTIONS) {
    return 418;
  }
  add_header Access-Control-Allow-Origin $cors_origin always;
  add_header Access-Control-Allow-Credentials true always;

  resolver ${WEBSITE_DNS_SERVER} ipv6=off valid=30s;
  js_fetch_verify off;

  js_content gloco.handleState;
}

location ~ ^/global-components/analytics/(.*) {
  error_page 418 = @gloco_preflight;
  if ($request_method = OPTIONS) {
    return 418;
  }

  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;

  add_header Access-Control-Allow-Origin $cors_origin always;
  add_header Access-Control-Allow-Credentials true always;

  resolver ${WEBSITE_DNS_SERVER} ipv6=off valid=30s;
  proxy_ssl_server_name on;
  proxy_pass https://uksouth-1.in.applicationinsights.azure.com/$1;
}

location /global-components/navigate-cms {
  js_content gloco.handleNavigateCms;
}

# ===========================================================================
# LEGACY navigate-cms — moved here from the old rcms.conf.
#
# The ORIGINAL inline implementation (gloco.getDomainFromCookie, a two-iframe
# page, and a SEPARATE /navigate-cms-close route). Kept as-is because apps in the
# programme may still call /api/navigate-cms and we cannot be sure they don't.
#
# DECISION (2026-07-20): do NOT unify these onto gloco.handleNavigateCms (the
# modern /global-components/navigate-cms above). Despite the name overlap they are
# DIFFERENT CONTRACTS — the client call signature differs (opaque $args + ?domain=
# and two iframes here, vs caseId/taskId + ?cmsDomain= and one iframe there), as do
# the close flow and error handling. This is a distinct legacy implementation, not
# a stale duplicate; left untouched deliberately.
# ===========================================================================
location = /api/navigate-cms {
  js_set $domainFromCookie gloco.getDomainFromCookie;
  if ( $ieaction = 'nonie+configurable+') {
    add_header X-InternetExplorerMode 1;
    return 302 "${WEBSITE_SCHEME}://${host}${request_uri}&domain=$domainFromCookie";
  }
  add_header Content-Type text/html;
  #
  # Once in IE mode we render the iframe. In pre-prod we need to attach to multiple cin environments: see elsewhere in the file for how to get the cin domain we need from
  # cookies using js_set.  We pass our query string to the Navigation/Notification.html page and it deals with setting some values in to the appropriate domain's
  # localStorage.  Once the iframe fires its onload event, we redirect back to Edge mode, only because it appears window.close works in Edge without prompting the user (in
  # IE mode it prompts the user for approval to close the tab).
  #
  return 200 '<html><body><script type="text/javascript">var c = 0; function fl() { if(++c > 1) { window.location.href="/navigate-cms-close"; } }</script><iframe src="${WEBSITE_SCHEME}://${host}/CMSModern/Navigation/Notification.html?$args" onload="fl()"></iframe><iframe src="https://$arg_domain/CMSModern/Navigation/Notification.html?$args" onload="fl()"></iframe></body></html>';
}

location = /navigate-cms-close {
  if ( $ieaction = 'ie+configurable+') {
    add_header X-InternetExplorerMode 0;
    return 302 "${WEBSITE_SCHEME}://${host}${request_uri}";
  }
  add_header Content-Type text/html;
  return 200 '<html><body></body><script>window.close();</script></html>';
}

# Case Review redirect: accepts ?URN=xxx&CMSCaseId=yyy from UI,
# constructs full auth handover chain, redirects through /auth-refresh-outbound.
# Path segments encode the OS subdomain and blob env folder:
#   /case-review-redirect/{osSubdomain}/{envFolder}
# e.g. /case-review-redirect/cps-tst/test
location /case-review-redirect/ {
  js_content gloco.handleCaseReviewRedirect;
}

location @gloco_preflight {
  internal;
  add_header Access-Control-Allow-Origin $cors_origin;
  add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
  add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Correlation-Id, X-Application, Cms-Auth-Values';
  add_header Access-Control-Allow-Credentials true;
  add_header Access-Control-Max-Age 86400;
  add_header Content-Length 0;
  add_header Content-Type 'text/plain';
  return 204;
}

