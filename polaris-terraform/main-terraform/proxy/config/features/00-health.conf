# Feature 0 💓 — health check
#
# Sliced out of nginx.conf (docs/PROXY.md §4/§6). Included by the parent via
# `include features/*.conf;`. Both are exact matches, so their placement relative
# to the parent's other locations does not matter.
#
# NOTE: these blocks declare their own add_header, so they do NOT inherit the
# server-level security headers — see docs/QUIRKS.md B3. Preserved verbatim.

location = / {
  add_header Content-Type text/plain;
  return 200 'Polaris Proxy is online';
}

location = /robots933456.txt {
  add_header Content-Type text/plain;
  return 200 'here';
}
