# Feature 6 🔌 — polaris-ddei internal routes
#
# DC-pinned CMS routes; "internal-only" via Azure network isolation, not nginx
# (docs/QUIRKS.md A4). Marked for deletion in §4 / docs/PLAN.md Phase 3.
#
# This feature owns ALL its getters in polaris-ddei.js (some duplicate cms-proxy's
# values) and js_sets its own *Internal-suffixed nginx variables, so it shares no
# server-global variable with cms-proxy — a clean, independently-deletable unit.
js_import polarisDdei from features/polaris-ddei.js;

location /internal-implementation/corsham/ {
  client_max_body_size 0; # until we find out what CMS's max upload size is
  access_log  /dev/stdout cms_log;
  limit_req zone=cmsgateway burst=${CMS_RATE_LIMIT_QUEUE};
  add_header 'x-limit-req-status' $limit_req_status always;
  
  # Determine proxy location and CMS domain
  js_set $proxyDestinationCorsham polarisDdei.proxyDestinationCorsham;
  js_set $upstreamCmsDomainNameInternal polarisDdei.upstreamCmsDomainName;
  
  sub_filter_once off;
  
  # Replace CMS domain names in response body
  js_set $upstreamCmsModernDomainNameInternal polarisDdei.upstreamCmsModernDomainName;
  js_set $upstreamCmsServicesDomainNameInternal polarisDdei.upstreamCmsServicesDomainName;
  js_set $upstreamCmsIpCorsham polarisDdei.upstreamCmsIpCorsham;
  js_set $upstreamCmsModernIpCorsham polarisDdei.upstreamCmsModernIpCorsham;

  sub_filter $upstreamCmsModernDomainNameInternal $host;
  sub_filter $upstreamCmsServicesDomainNameInternal $host;
  sub_filter $upstreamCmsDomainNameInternal $host;
  sub_filter $upstreamCmsIpCorsham $host;
  sub_filter $upstreamCmsModernIpCorsham $host;
  
  proxy_redirect     off;
  proxy_ssl_server_name on;
  proxy_ssl_session_reuse off;
  proxy_set_header Host $upstreamCmsDomainNameInternal:443;
  proxy_set_header X-Forwarded-For $remote_addr;
			
	    rewrite ^/internal-implementation/corsham/(.*) /$1 break;
  proxy_pass $proxyDestinationCorsham/$1$is_args$args;
}

location /internal-implementation/corsham/modern/ {
  access_log  /dev/stdout cms_log;
  limit_req zone=cmsgateway burst=${CMS_RATE_LIMIT_QUEUE};
  add_header 'x-limit-req-status' $limit_req_status always;
  
  # Determine proxy location and CMS domain
  js_set $proxyDestinationCorshamModern polarisDdei.proxyDestinationModernCorsham;
  js_set $upstreamCmsModernDomainNameInternal polarisDdei.upstreamCmsModernDomainName;

  proxy_redirect     off;
  proxy_ssl_server_name on;
  proxy_ssl_session_reuse off;
  proxy_ssl_verify off;
  proxy_http_version 1.1;
  # For audit purposes we artificially pass the CMS User Id in a UID=123456 cookie.
  # We do this so we can log in the same way as CMS Classic traffic.
  # Modern does not expect this cookie, so lets remove it once logged.
  proxy_set_header Cookie "";
  # We also pass other headers that are not expected by Modern for the purposes of logging
  # so lets remove them too.
  proxy_set_header Polaris-Context-Identifier "";
  proxy_set_header Polaris-Operation-Name "";
  proxy_set_header Polaris-Operation-Values "";
  # Attempt to combat the effect of 504s coming from Modern
  # see https://stackoverflow.com/a/36589120
  proxy_set_header Connection "";
  proxy_set_header Host $upstreamCmsModernDomainNameInternal:443;
  proxy_set_header X-Forwarded-For $remote_addr;

  rewrite ^/internal-implementation/corsham/modern/(.*) /$1 break;
  proxy_pass $proxyDestinationCorshamModern/$1$is_args$args;
}

