# Feature 4 📁 — CWA / materials (+ gateway API + telemetry)
#
# SPA, /materials handover, Materials UI, /api/ gateway, /v2/ App Insights. The
# materials deep-link regex does NOT overlap the CMS regexes in 05.

location /${APP_SUBFOLDER_PATH} {
  sub_filter_once off;
  sub_filter_types *;
  sub_filter_types text/xml text/css text/javascript;
  sub_filter uksouth-1.in.applicationinsights.azure.com ${WEBSITE_HOSTNAME};
  proxy_pass ${ENDPOINT_HTTP_PROTOCOL}://${APP_ENDPOINT_DOMAIN_NAME};
}

location /materials {
  # Case Specific Materials UI page.
  if ($arg_caseUrn != "") {
      return 302 https://$host/polaris?r=https://$host/auth-refresh-inbound?polaris-ui-url=/materials-ui/$arg_caseUrn/$arg_caseId/materials;
  }

  # Generic Materials UI page.
  return 302 https://$host/polaris?r=https://$host/auth-refresh-inbound?polaris-ui-url=/materials-ui;
}

		location = /materials-ui {
  return 302 /materials-ui/;
}

location ~ ^/materials-ui/[^/]+/[^/]+/materials$ {
    sub_filter_once off;
    sub_filter_types *;
    sub_filter uksouth-1.in.applicationinsights.azure.com ${WEBSITE_HOSTNAME};

    proxy_pass ${ENDPOINT_HTTP_PROTOCOL}://${MATERIALS_APP_ENDPOINT_DOMAIN_NAME};
}

location /materials-ui/ {
  sub_filter_once off;
  sub_filter_types *;
  sub_filter_types text/xml text/css text/javascript;
  sub_filter uksouth-1.in.applicationinsights.azure.com ${WEBSITE_HOSTNAME};
  proxy_pass ${ENDPOINT_HTTP_PROTOCOL}://${MATERIALS_APP_ENDPOINT_DOMAIN_NAME}/materials-ui/;
}

location /api/ {
  sub_filter_once off;
  # We need to translate gateway-specific URLs found in API responses
  #  to proxy URLs (important in pipeline tracker polling flow where pipeline initiation call returns a polling address)
  sub_filter ${API_ENDPOINT_DOMAIN_NAME} $host;
  # By default nginx will only filter/transpose in html documents, so we include .json API
  #  responses by setting wildcard to filter all response content types
  sub_filter_types *;
  sub_filter ${SAS_URL_DOMAIN_NAME}/ $host/sas-url/;
  proxy_redirect off;
  proxy_ssl_server_name on;
  proxy_set_header Host ${API_ENDPOINT_DOMAIN_NAME}:443;
  proxy_set_header X-Forwarded-For $remote_addr;

  proxy_pass ${ENDPOINT_HTTP_PROTOCOL}://${API_ENDPOINT_DOMAIN_NAME};
}

	location /v2/ {
  proxy_pass https://uksouth-1.in.applicationinsights.azure.com/v2/;
}
