# Feature 5 🔀 — CMS proxy
#
# The refactor's blast radius: every block here resolves its CMS upstream and
# rewrites the response body via this feature's own module, cms-proxy.js.
# Sliced CONTIGUOUSLY out of nginx.conf, so the five CMS regexes keep their
# original relative order — the first-match-wins ordering contract (docs/PROXY.md
# §5). KEEP ALL CMS REGEXES IN THIS FILE, IN THIS ORDER:
#   ^/CMS\..*/Includes/uainGeneratedScript.aspx
#   ^/CMS\..*/Noexpiry/Toolbar/uainMenuBar.js
#   ^/CMS\..*/Case/uacdCDTabs.aspx
#   ^/CMSModern/Files.*
#   ^/CMS.*                (catch-all — MUST stay last of the CMS regexes)
# Everything this conf js_sets — the CMS-upstream getters and the response-body
# filters — lives in cms-proxy.js beside it (which imports common.cms-detection for the shared
# detection/env primitive). No feature shares these, so none of it is central.
js_import cmsProxy from templates/features/cms-proxy/cms-proxy.js;

location /polaris-script.js {
  default_type application/javascript;
  root /etc/nginx/templates/features/cms-proxy;
  try_files /polaris-script.js =404;
}

# uainGeneratedScript to replace c-button
location ~ ^/CMS\..*/Includes/uainGeneratedScript.aspx {
  access_log  /dev/stdout cms_log;
  limit_req zone=cmsproxy burst=${CMS_RATE_LIMIT_QUEUE};
  add_header 'x-limit-req-status' $limit_req_status always;

  # Determine proxy location and CMS domain
  js_set $proxyDestination cmsProxy.proxyDestinationCorsham;
  js_set $upstreamCmsDomainName cmsProxy.upstreamCmsDomainName;
  js_set $upstreamCmsModernDomainName cmsProxy.upstreamCmsModernDomainName;
  js_set $upstreamCmsServicesDomainName cmsProxy.upstreamCmsServicesDomainName;

  sub_filter_types *;
  sub_filter_once off;
  sub_filter https:// ${WEBSITE_SCHEME}://;

  sub_filter $upstreamCmsModernDomainName $host;
  sub_filter $upstreamCmsServicesDomainName $host;
  sub_filter $upstreamCmsDomainName $host;
  
  # Replace the c-button to support proxied CMS
  sub_filter 'var CASEWORK_TOOLS_URL = \'https://polaris.cps.gov.uk/launch/cms\';' 'var CASEWORK_TOOLS_URL = \'https://polaris.cps.gov.uk/launch/cms-proxy\';';
  sub_filter 'var CASEWORK_TOOLS_URL = \'https://polaris-qa-notprod.cps.gov.uk/launch/cin2\';' 'var CASEWORK_TOOLS_URL = \'https://polaris-qa-notprod.cps.gov.uk/launch/cin2-proxy\';';
  sub_filter 'var CASEWORK_TOOLS_URL = \'https://polaris-qa-notprod.cps.gov.uk/launch/cin3\';' 'var CASEWORK_TOOLS_URL = \'https://polaris-qa-notprod.cps.gov.uk/launch/cin3-proxy\';';
  sub_filter 'var CASEWORK_TOOLS_URL = \'https://polaris-qa-notprod.cps.gov.uk/launch/cin4\';' 'var CASEWORK_TOOLS_URL = \'https://polaris-qa-notprod.cps.gov.uk/launch/cin4-proxy\';';
  sub_filter 'var CASEWORK_TOOLS_URL = \'https://polaris-qa-notprod.cps.gov.uk/launch/cin5\';' 'var CASEWORK_TOOLS_URL = \'https://polaris-qa-notprod.cps.gov.uk/launch/cin5-proxy\';';
  
  proxy_redirect     off;
  proxy_ssl_server_name on;
  proxy_ssl_session_reuse off;
  proxy_ssl_verify off;

  proxy_set_header Host $upstreamCmsDomainName:443;
  proxy_set_header X-Forwarded-For $remote_addr;

  proxy_pass $proxyDestination;
}

# CMS UI traffic
# CMS menu bar JS - add task list link
location ~ ^/CMS\..*/Noexpiry/Toolbar/uainMenuBar.js {
  access_log  /dev/stdout cms_log;
  limit_req zone=cmsproxy burst=${CMS_RATE_LIMIT_QUEUE};
  add_header 'x-limit-req-status' $limit_req_status always;

  # Determine proxy location and CMS domain
  js_set $proxyDestination cmsProxy.proxyDestinationCorsham;
  js_set $upstreamCmsDomainName cmsProxy.upstreamCmsDomainName;
  
  # App launch buttons
  js_body_filter cmsProxy.cmsMenuBarFilters;

  sub_filter_types *;
  sub_filter_once off;
  sub_filter https:// ${WEBSITE_SCHEME}://;

  sub_filter 'function openPolaris() {' '
  function openMaterials() {
    var sMaterialsUrl = "/materials";
    var iTempCaseId = 0;
    var sTempCaseUrn = "";

    if (typeof iScreenCaseID != "undefined") {
      iTempCaseId = iScreenCaseID;
    } else if (typeof iCaseId != "undefined") {
      iTempCaseId = iCaseId;
    } else if (typeof m_iScreenCaseID != "undefined") {
      iTempCaseId = m_iScreenCaseID;
    }

    if (typeof sURN != "undefined") {
      sTempCaseUrn = sURN;
    } else if (typeof caseUrn != "undefined") {
      sTempCaseUrn = caseUrn;
    }

    // Fallback for pages like PreChargeDecRequests
    if (!sTempCaseUrn) {
      var cells = document.getElementsByTagName("td");

      for (var i = 0; i < cells.length; i++) {
        var text = cells[i].innerText || cells[i].textContent;

        if (!text) continue;

        var match = text.match(/\\b\\d{2}[A-Z]{2}\\d{7}\\b/);
        if (match) {
          sTempCaseUrn = match[0];
          break;
        }
      }
    }

    if (iTempCaseId > 0 && sTempCaseUrn) {
      sMaterialsUrl += "?caseUrn=" + encodeURIComponent(sTempCaseUrn) + "&caseId=" + encodeURIComponent(iTempCaseId);
    }

    var win = window.open(sMaterialsUrl);
    if (win != null) {
      win.focus();
    }
  }

  function openPolaris() {';
        
  proxy_redirect     off;
  proxy_ssl_server_name on;
  proxy_ssl_session_reuse off;
  proxy_ssl_verify off;

  proxy_set_header Host $upstreamCmsDomainName:443;
  proxy_set_header X-Forwarded-For $remote_addr;

  proxy_pass $proxyDestination;
}

location ~ ^/CMS\..*/Case/uacdCDTabs.aspx {
  access_log  /dev/stdout cms_log;
  limit_req zone=cmsproxy burst=${CMS_RATE_LIMIT_QUEUE};
  add_header 'x-limit-req-status' $limit_req_status always;

  # Determine proxy location and CMS domain
  js_set $proxyDestination cmsProxy.proxyDestinationCorsham;
  js_set $upstreamCmsDomainName cmsProxy.upstreamCmsDomainName;

  # Replace CMS domain names in response body
  js_body_filter cmsProxy.replaceCmsDomains;

  sub_filter_types *;
  sub_filter_once off;
  sub_filter https:// ${WEBSITE_SCHEME}://;

  sub_filter '</html>' '<script src="/polaris-script.js"></script></html>';

  proxy_redirect     off;
  proxy_ssl_server_name on;
  proxy_ssl_session_reuse off;
  proxy_ssl_verify off;

  proxy_set_header Host $upstreamCmsDomainName:443;
  proxy_set_header X-Forwarded-For $remote_addr;

  proxy_pass $proxyDestination;
}

# CMS Services traffic (CMSModern paths) - browser-based requests
location ~ ^/CMSModern/Files.* {
  client_max_body_size 0;
  access_log  /dev/stdout cms_log;
  limit_req zone=cmsproxy burst=${CMS_RATE_LIMIT_QUEUE};
  add_header 'x-limit-req-status' $limit_req_status always;

  # IE Mode Desired - included for consistency, can be removed if not needed
  if ( $ieaction = 'nonie+nonconfigurable+') {
    return 402 'requires Internet Explorer mode';
  }
  if ( $ieaction = 'nonie+configurable+') {
    add_header X-InternetExplorerMode 1;
    return 302 "${WEBSITE_SCHEME}://${host}${request_uri}";
  }

  # Determine CMS Services domain
  js_set $upstreamCmsServicesDomainName cmsProxy.upstreamCmsServicesDomainName;
  js_set $upstreamCmsDomainName cmsProxy.upstreamCmsDomainName;
  js_set $upstreamCmsModernDomainName cmsProxy.upstreamCmsModernDomainName;

  sub_filter_types *;
  sub_filter_once off;
  sub_filter https:// ${WEBSITE_SCHEME}://;
  sub_filter '</html>' '<!-- CMSModern Services rule applied --></html>';
  
  sub_filter $upstreamCmsModernDomainName $host;
  sub_filter $upstreamCmsServicesDomainName $host;
  sub_filter $upstreamCmsDomainName $host;
  
  proxy_redirect ~^(http|https)://[^/]+(/.*)?$ ${WEBSITE_SCHEME}://$host$2;
  proxy_ssl_server_name on;
  proxy_ssl_session_reuse off;
  proxy_ssl_verify off;

  proxy_set_header Host $upstreamCmsServicesDomainName:443;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Via "Polaris-Proxy";

  # Proxy using DNS name - required for browser-based requests
  proxy_pass https://$upstreamCmsServicesDomainName;
}

# When regex rules are used, nginx stops processing rules when it finds the first rule that matches a 
#  route. So we put the most general route last, to avoid it taking precedence over the more specific 
#  rules above.
location ~ ^/CMS.* {
  client_max_body_size 0; # until we find out what CMS's max upload size is
  access_log  /dev/stdout cms_log;
  limit_req zone=cmsproxy burst=${CMS_RATE_LIMIT_QUEUE};
  add_header 'x-limit-req-status' $limit_req_status always;

  # IE Mode Desired
  if ( $ieaction = 'nonie+nonconfigurable+') {
    return 402 'requires Internet Explorer mode';
  }
  if ( $ieaction = 'nonie+configurable+') {
    add_header X-InternetExplorerMode 1;
    return 302 "${WEBSITE_SCHEME}://${host}${request_uri}";
  }

  # Determine proxy location and CMS domain
  js_set $proxyDestination cmsProxy.proxyDestinationCorsham;
  js_set $upstreamCmsDomainName cmsProxy.upstreamCmsDomainName;
  
  js_set $upstreamCmsModernDomainName cmsProxy.upstreamCmsModernDomainName;
  js_set $upstreamCmsServicesDomainName cmsProxy.upstreamCmsServicesDomainName;

  sub_filter_types *;
  sub_filter_once off;
  sub_filter https:// ${WEBSITE_SCHEME}://;
  sub_filter '</html>' '<!-- General rule applied --></html>';
  
  sub_filter $upstreamCmsModernDomainName $host;
  sub_filter $upstreamCmsServicesDomainName $host;
  sub_filter $upstreamCmsDomainName $host;
  
  #proxy_redirect     off;
  proxy_redirect ~^(http|https)://[^/]+(/.*)?$ ${WEBSITE_SCHEME}://$host$2;
  proxy_ssl_server_name on;

  proxy_ssl_session_reuse off;
  proxy_ssl_verify off;

  proxy_set_header Host $upstreamCmsDomainName:443;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Via "Polaris-Proxy";

  proxy_pass $proxyDestination;
}

# Environment-switch endpoints /cin2../cin5 (pre-prod only). Set the __CMSENV hint
# cookie + clear the other envs' confounding LB/pool cookies, then 302 to /CMS. The
# four near-identical blocks (IE gate + cookies + redirect) collapse to one njs
# handler; it reads $ieaction (ie-mode.js) and picks the env from the request path.
location /cin2 { js_content cmsProxy.cinSwitch; }
location /cin3 { js_content cmsProxy.cinSwitch; }
location /cin4 { js_content cmsProxy.cinSwitch; }
location /cin5 { js_content cmsProxy.cinSwitch; }

# At development time it is useful to have a path through to CMS Modern
location / {
  access_log  /dev/stdout cms_log;
  limit_req zone=cmsproxy burst=${CMS_RATE_LIMIT_QUEUE};
  add_header 'x-limit-req-status' $limit_req_status always;

  # Determine proxy location and CMS domain
  js_set $proxyDestinationModern cmsProxy.proxyDestinationModernCorsham;
  js_set $upstreamCmsModernDomainName cmsProxy.upstreamCmsModernDomainName;
  
  js_set $upstreamCmsDomainName cmsProxy.upstreamCmsDomainName;
  js_set $upstreamCmsServicesDomainName cmsProxy.upstreamCmsServicesDomainName;

  sub_filter_once off;
  sub_filter_types text/xml text/css text/javascript text/html application/json application/javascript;
  sub_filter https:// ${WEBSITE_SCHEME}://;
  
  sub_filter $upstreamCmsModernDomainName $host;
  sub_filter $upstreamCmsServicesDomainName $host;
  sub_filter $upstreamCmsDomainName $host;

  proxy_redirect     off;
  proxy_ssl_server_name on;
  proxy_ssl_session_reuse off;
  proxy_ssl_verify off;
  proxy_http_version 1.1;
  # Attempt to combat the effect of 504s coming from Modern
  # see https://stackoverflow.com/a/36589120
  proxy_set_header Connection "";
  proxy_set_header Host $upstreamCmsModernDomainName:443;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Via "Polaris-Proxy";

  rewrite ^/(.*) /$1 break;
  proxy_pass $proxyDestinationModern$request_uri;
}

location /ajax/viewer/ {
  access_log  /dev/stdout cms_log;
  limit_req zone=cmsproxy burst=${CMS_RATE_LIMIT_QUEUE};
  add_header 'x-limit-req-status' $limit_req_status always;

  # Determine proxy location and CMS domain
  js_set $proxyDestinationModern cmsProxy.proxyDestinationModernCorsham;
  js_set $upstreamCmsModernDomainName cmsProxy.upstreamCmsModernDomainName;

  # Replace CMS domain names in response body
  js_body_filter cmsProxy.replaceCmsDomainsAjaxViewer;

  sub_filter_once off;
  sub_filter_types *;
  sub_filter_types text/xml text/css text/javascript;
  sub_filter https:// ${WEBSITE_SCHEME}://;

  proxy_redirect     off;
  proxy_ssl_server_name on;

  # proxy_ssl_protocols TLSv1 TLSv1.1;
  # proxy_ssl_ciphers ECDH+AESGCM:DH+AESGCM:ECDH+AES256:DH+AES256:ECDH+AES128:DH+AES:ECDH+3DES:DH+3DES:RSA+AES:RSA+3DES:!aNULL:!MD5:!DSS;
  proxy_ssl_session_reuse off;
  proxy_ssl_verify off;

  proxy_set_header Host $upstreamCmsModernDomainName;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_http_version 1.1;

  rewrite ^/ajax/viewer/(.*) /$1 break;
  proxy_pass $proxyDestinationModern/ajax//viewer/$1$is_args$args;
}
