# Feature 1 🚀 — app launch from CMS
#
# 10 static handover redirects, sliced out of nginx.conf (docs/PROXY.md §4/§6).
# Pure `return 302` prefix locations — order-independent. Only /launch/cms is
# env-driven (${DEFAULT_UPSTREAM_CMS_DOMAIN_NAME}); the rest hardcode their domains.
# §4 notes these "can be collapsed into one (maybe needs njs)".

location /launch/cms {
  return 302 https://${DEFAULT_UPSTREAM_CMS_DOMAIN_NAME}/polaris?r=https%3A%2F%2Fcps.outsystemsenterprise.com%2FCasework_Patterns%2Fauth-handover.html%3Fsrc%3Dhttps%3A%2F%2Fpolaris.cps.gov.uk%2Fglobal-components%2Fprod%2Fauth-handover.js%26stage%3Dos-cookie-return%26r%3Dhttps%253A%252F%252Fcps.outsystemsenterprise.com%252Fcasework_blocks%252Fhome%253FIsFromCMS%253DTrue;
}
