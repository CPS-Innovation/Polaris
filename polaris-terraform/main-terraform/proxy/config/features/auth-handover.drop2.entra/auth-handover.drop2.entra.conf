# Feature — Entra store  (drop2, switch-gated ENTRA_STORE_ENABLED, isolated new-gen)
#
# The Azure AD half of the handover: after drop1 establishes the CMS session, do a
# silent OIDC round-trip and deposit {cookies, modern token} into a key-value store
# keyed by the Entra OID (auth-handover.drop2.entra.js + store.js). Reached ONLY when
# ENTRA_STORE_ENABLED=true, via an internal rewrite from /auth-refresh-inbound — the
# switch lives in auth-handover.conf, beside drop1's (ENTRA takes precedence; it runs
# drop1's establish step internally).
#
# NOT part of the golden-master before/after (docs/PLAN.md): dormant with the switch
# off, so --next stays behaviour-identical to the live monolith. Imports drop1 +
# store.js; drop1 imports nothing back, so this feature — and store.js with it — deletes
# cleanly.
js_import entraStore from templates/features/auth-handover.drop2.entra/auth-handover.drop2.entra.js;

# Begin: establish the CMS session (drop1) then 302 to Entra /authorize (prompt=none).
# Internal — only reachable via the ENTRA_STORE_ENABLED rewrite. resolver +
# js_fetch_verify off are for the drop1 $host CMS loopbacks (mint + verify).
location = /init-entra {
  internal;
  resolver ${WEBSITE_DNS_SERVER} ipv6=off valid=30s;
  js_fetch_verify off;
  js_content entraStore.handleInitEntra;
}

# Callback: Entra 302s the BROWSER here, so it must be PUBLIC (not internal) and its path
# must match a redirect URI registered on the app reg. The redirect_uri is derived per-request
# from the Host in the njs (no ENTRA_REDIRECT_URI setting); this path (/init-v2/callback) is the
# fixed half — the njs CALLBACK_PATH must match it. resolver +
# js_fetch_verify off are for the ngx.fetch to the AD token endpoint + Table Storage.
#
# The add_header here is DELIBERATE: by QUIRK B3 a location that sets ANY add_header sheds
# the server's inherited headers — including `X-Frame-Options: DENY` — which otherwise
# blocks the iframe terminal page from rendering inside the CMS shell. We replace it with a
# scoped frame-ancestors CSP (only *.cps.gov.uk may frame). Harmless on the top-level 302.
location = /init-v2/callback {
  resolver ${WEBSITE_DNS_SERVER} ipv6=off valid=30s;
  js_fetch_verify off;
  add_header Content-Security-Policy "frame-ancestors https://*.cps.gov.uk" always;
  js_content entraStore.handleInitEntraCallback;
}
