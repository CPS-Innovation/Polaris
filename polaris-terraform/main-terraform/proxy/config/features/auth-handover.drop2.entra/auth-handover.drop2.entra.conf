# Feature — Entra store  (drop2, switch-gated ENTRA_STORE_ENABLED, isolated new-gen)
#
# The Azure AD half of the handover, run from /init (R0) for EVERY destination: look up the CMS
# session, do ONE silent, neutral sign-in (openid profile offline_access), swap its refresh token
# for an MDS token, and deposit {cookies, modern token} to MDS PUT /cms-auth-store, which
# identifies the user from that token (auth-handover.drop2.entra.js + store.js); then carry on as
# /init would (302 to r with cc). On the hidden-iframe terminal it also sets the presence token
# cookie (global-components' presence transports read it). Started by auth-handover's
# appAuthRedirect (/init) when ENTRA_STORE_ENABLED=true or the browser is enrolled — so its
# locations here are only: the public callback (= /init/entra-callback), the iframe terminal
# page (= /init/terminal) and the apps' login-hint endpoint (= /global-components/entra-login-hint,
# + its internal @entra_hint_preflight).
#
# NOT part of the golden-master before/after (docs/PLAN.md): dormant with the switch
# off, so --next stays behaviour-identical to the live monolith. Imports drop1 +
# store.js; drop1 imports nothing back.
js_import entraStore from templates/features/auth-handover.drop2.entra/auth-handover.drop2.entra.js;

# The hint endpoint's CORS origin: global-components' $cors_origin, https only (it returns who
# the user is). See the location below.
js_set $entra_hint_cors_origin entraStore.hintCorsOrigin;

# Callback: Entra 302s the BROWSER here, so it must be PUBLIC (not internal) and its path
# must match a redirect URI registered on the app reg. The redirect_uri is derived per-request
# from the Host in the njs (no ENTRA_REDIRECT_URI setting); this path (/init/entra-callback) is the
# fixed half — the njs CALLBACK_PATH must match it. An EXACT match, so it wins over the prefix
# `location /init`. The resolver is for the ngx.fetch to the AD token endpoint (exchange +
# refresh-token swaps) and MDS, both public-CA https: verified against the image's CA bundle
# (QUIRK E6; present in nginx:latest and the alpine test image). js_fetch_timeout bounds each call
# (njs default 60s): a slow AD / MDS degrades the handover — carries on — instead of stalling it.
#
# The add_header here is DELIBERATE: by QUIRK B3 a location that sets ANY add_header sheds
# the server's inherited headers — including `X-Frame-Options: DENY` — which otherwise
# blocks the iframe terminal page from rendering inside the CMS shell. We replace it with a
# scoped frame-ancestors CSP (only *.cps.gov.uk may frame). Harmless on the top-level 302.
location = /init/entra-callback {
  resolver ${WEBSITE_DNS_SERVER} ipv6=off valid=30s;
  js_fetch_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
  js_fetch_timeout 10s;
  add_header Content-Security-Policy "frame-ancestors https://*.cps.gov.uk" always;
  js_content entraStore.handleInitEntraCallback;
}

# The hidden iframe's end page when drop2 did NOT start (off, unconfigured, no CMS session, …):
# auth-handover's /init 302s terminal=iframe here rather than carrying on into the Polaris UI.
# Static (no state, no cookies). Same deliberate add_header as the callback — the scoped
# frame-ancestors CSP that sheds the server's X-Frame-Options: DENY — so it renders in the CMS
# frame and fires the harness's onload. Exact match: wins over the prefix `location /init`.
location = /init/terminal {
  add_header Content-Security-Policy "frame-ancestors https://*.cps.gov.uk" always;
  js_content entraStore.terminal;
}

# D7 — the login hint for apps: GET -> {loginHint, username, oid, tid, setAt, via} | null; DELETE forgets
# it. Read from the browser's cps-entra-login-hint cookie (set at /init/entra-callback), so apps call
# it with credentials. CORS: global-components' $cors_origin (*.cps.gov.uk + its list), but https
# ONLY ($entra_hint_cors_origin) — it returns UPN / oid — with its own preflight for the same
# reason. Exact match, so no /global-components regex catches it.
location = /global-components/entra-login-hint {
  error_page 418 = @entra_hint_preflight;
  if ($request_method = OPTIONS) {
    return 418;
  }
  add_header Access-Control-Allow-Origin $entra_hint_cors_origin always;
  add_header Access-Control-Allow-Credentials true always;

  js_content entraStore.loginHint;
}

# The hint endpoint's preflight: as global-components' @gloco_preflight, but https origins only
# and just the methods the endpoint serves.
location @entra_hint_preflight {
  internal;
  add_header Access-Control-Allow-Origin $entra_hint_cors_origin;
  add_header Access-Control-Allow-Methods 'GET, DELETE, OPTIONS';
  add_header Access-Control-Allow-Credentials true;
  add_header Access-Control-Max-Age 86400;
  add_header Content-Length 0;
  add_header Content-Type 'text/plain';
  return 204;
}
