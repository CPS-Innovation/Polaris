# Feature 1 🚀 — app launch from CMS
#
# Ten near-identical handover redirects (docs/PROXY.md §4/§6) collapsed into one
# njs handler (app-launch.js) — §4's "can be collapsed into one (maybe needs njs)".
# Only the handover host and the OutSystems tier (prod/test) vary; the handler
# builds the exact same (double-encoded) URLs the static blocks did (proven by
# app-launch.unit.test.js + 01-app-launch.integration.test.js).
#
# Kept a PREFIX location (not a regex) so matching precedence is unchanged from
# the original per-key /launch/<key> prefix blocks. An unknown /launch/<key> now
# 404s (the handler owns the whole /launch/ prefix) rather than falling through.
js_import appLaunch from features/app-launch.js;

location /launch/ {
  js_content appLaunch.launch;
}
