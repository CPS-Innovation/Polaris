# Feature — non-DDEI init  (switch-gated, isolated new-gen functionality)
#
# The reworked /init: DDEI's /api/init/ done entirely in njs (polaris-non-ddei.js).
# Reached ONLY when NON_DDEI_INIT_ENABLED=true, via an internal rewrite from
# /auth-refresh-inbound — the switch lives in auth-handover.conf. The /polaris-non-ddei
# sideways entry is deliberately NOT brought across: the existing /polaris -> /init
# entry is reused, and the switch flips only the terminal init step (every handover
# flow funnels through /auth-refresh-inbound, so one gate flips them all).
#
# NOT part of the golden-master before/after (docs/PLAN.md): dormant with the switch
# off, so --next stays behaviour-identical to the live monolith. Self-contained (its
# own njs, no shared imports) so it — and polaris-ddei with it — can be deleted cleanly.
js_import polarisNonDdei from templates/features/polaris-non-ddei/polaris-non-ddei.js;

location = /init-non-ddei {
  internal;                                            # only reachable via the internal rewrite
  resolver ${WEBSITE_DNS_SERVER} ipv6=off valid=30s;   # for the ngx.fetch $host loopbacks
  js_fetch_verify off;                                 # the loopback fetch carries a spoofed UA
  js_content polarisNonDdei.handleInitNonDdei;
}
