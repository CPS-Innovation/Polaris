# Feature — dev login without DDEI (switch-gated, pre-prod tooling)
#
# /dev-login/ and /api/dev-login-full-cookie/ themselves stay in auth-handover.conf, where the
# drop1 gate ($non_ddei) rewrites them here when on; off, they proxy to DDEI as today. The CMS
# login is two $host loopbacks (GET /CMS, POST …/User/uaulLogin.aspx) through the proxy's own
# ^/CMS.* routing — hence resolver + js_fetch_verify off, as drop1. See dev-login.js.
js_import devLoginNonDdei from templates/features/dev-login/dev-login.js;

location = /dev-login-non-ddei {
  internal;
  client_max_body_size 16k;      # a login form
  client_body_buffer_size 16k;   # kept in memory, so js_content can read r.requestText
  resolver ${WEBSITE_DNS_SERVER} ipv6=off valid=30s;
  js_fetch_verify off;
  js_content devLoginNonDdei.devLogin;
}

location = /dev-login-full-cookie-non-ddei {
  internal;
  client_max_body_size 16k;
  client_body_buffer_size 16k;
  resolver ${WEBSITE_DNS_SERVER} ipv6=off valid=30s;
  js_fetch_verify off;
  js_content devLoginNonDdei.devLoginFullCookie;
}
