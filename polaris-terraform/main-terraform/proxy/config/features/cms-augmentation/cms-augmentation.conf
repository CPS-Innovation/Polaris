# Feature — cms-augmentation
#
# Brought across from global-components global-components.cms-auth-v2:
#  - the uaglCMS.aspx route: intercepts the CMS frameset shell (uaglCMS.aspx — the top window
#    that lives for the whole CMS session) and sub_filter-injects our client <script> into its
#    <head>, so the client runs once per session (hosts the presence + token logic).
#  - the client script itself (cms-augmentation.js, was cms-auth-v2-client.js) and the presence
#    relay (presence-relay.html, was cms-presence-relay.html) — now served DIRECTLY from nginx
#    out of this feature folder, instead of the /global-components/<env>/ blob route.
#
# NEW-GEN, outside the golden master: not in the live monolith. Unlike case-locking (which
# added only disjoint paths), this OVERRIDES one existing CMS path — the exact
# `= /CMS.24.0.01/uaglCMS.aspx` beats cms-proxy's `^/CMS.*` catch-all for that one URL to add
# the injection; otherwise it proxies identically.
#
# FEATURE DEPENDENCY (getters): the uaglCMS route needs the per-CMS-env upstream getters. This
# feature already fully depends on cms-proxy (it OVERRIDES cms-proxy's `^/CMS.*` catch-all for this
# one URL and mirrors its proxying — see AU3), so it reuses cms-proxy's already-global `cmsProxy`
# binding directly rather than keeping a feature-local copy. js_set VARIABLE names are server-global
# and `[emerg] redeclare` if the same name is bound to a different function, so we still use DISTINCT
# `$aug*` names — but point them at cmsProxy.*. No own module, no duplication. See QUIRKS AU1.

# Serve the injected client script directly from this feature folder (mirrors cms-proxy's
# /polaris-script.js pattern). Exact `=` beats cms-proxy's `location /` catch-all.
location = /cms-augmentation.js {
  default_type application/javascript;
  root /etc/nginx/templates/features/cms-augmentation;
  try_files /cms-augmentation.js =404;
}

# Serve the presence relay directly (consumed by cms-augmentation.js as PRESENCE_RELAY_URL).
location = /presence-relay.html {
  default_type text/html;
  root /etc/nginx/templates/features/cms-augmentation;
  try_files /presence-relay.html =404;
}

# Inject the client <script> into the CMS frameset shell. Exact `=` beats the deployed `^/CMS.*`
# catch-all for this one URL; the rest mirrors that catch-all's proxying. Anchor on </head> (NOT
# </html>): uaglCMS.aspx is a <frameset> doc where a script after </frameset> is invalid — head
# scripts run. Path is version-pinned (see QUIRKS AU2).
location = /CMS.24.0.01/uaglCMS.aspx {
  client_max_body_size 0;
  access_log  /dev/stdout cms_log;
  limit_req zone=cmsproxy burst=${CMS_RATE_LIMIT_QUEUE};
  add_header 'x-limit-req-status' $limit_req_status always;

  # IE Mode Desired
  if ( $ieaction = 'nonie+nonconfigurable+') {
    return 402 'requires Internet Explorer mode';
  }
  if ( $ieaction = 'nonie+configurable+') {
    add_header X-InternetExplorerMode 1;
    return 302 "${WEBSITE_SCHEME}://${host}${request_uri}";
  }

  # Per-CMS-env upstream (distinct $aug* names, cmsProxy.* getters — see FEATURE DEPENDENCY above).
  js_set $augProxyDestination cmsProxy.proxyDestinationCorsham;
  js_set $augUpstreamCmsDomainName cmsProxy.upstreamCmsDomainName;
  js_set $augUpstreamCmsModernDomainName cmsProxy.upstreamCmsModernDomainName;
  js_set $augUpstreamCmsServicesDomainName cmsProxy.upstreamCmsServicesDomainName;

  sub_filter_types *;
  sub_filter_once off;
  sub_filter https:// ${WEBSITE_SCHEME}://;

  # Inject our client script into the frameset shell's <head>.
  sub_filter '</head>' '<script type="text/javascript" src="/cms-augmentation.js"></script></head>';

  sub_filter $augUpstreamCmsModernDomainName $host;
  sub_filter $augUpstreamCmsServicesDomainName $host;
  sub_filter $augUpstreamCmsDomainName $host;

  # Disable gzip so sub_filter can inspect the body
  proxy_set_header Accept-Encoding "";

  proxy_redirect ~^(http|https)://[^/]+(/.*)?$ ${WEBSITE_SCHEME}://$host$2;
  proxy_ssl_server_name on;
  proxy_ssl_session_reuse off;
  proxy_ssl_verify off;

  proxy_set_header Host $augUpstreamCmsDomainName:443;
  proxy_set_header X-Forwarded-For $remote_addr;

  proxy_pass $augProxyDestination;
}
