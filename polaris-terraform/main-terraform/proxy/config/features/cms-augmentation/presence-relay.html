<!DOCTYPE html>
<!--
  cms-presence-relay.html — the presence "engine", hosted on the polaris origin.

  WHY THIS EXISTS: the CMS runs on a different subdomain (cms.cps.gov.uk) from our
  endpoints (polaris.cps.gov.uk). On this IE-mode estate, cross-origin XHR is gated
  by the Local Intranet zone "Access data sources across domains" = Prompt, so the
  CMS page cannot call the presence API directly. This page runs on the POLARIS
  origin, so its XHR to the presence route (global-components.cms-presence.conf) is
  SAME-ORIGIN (no prompt, and the Authorization header survives). The injected CMS
  script embeds this as a
  hidden iframe and talks to it purely through Domain=cps.gov.uk cookies.
  See memory reference_cms_polaris_xorigin_zone.

  PROTOCOL (cookies, all Domain=cps.gov.uk):
    cc_presence_cmd     (CMS -> relay): the sectionId to hold a session for, or ""
                        to stop. Format "<caseId>:VICTIM_WITNESS:<personId>".
    cc_presence_result  (relay -> CMS): "<sid>||<memberCount>||<email1,email2,...>"
                        or "<sid>||ERR||<detail>". CMS reads this for the banner.

  IE MODE: document-mode-safe JS (var, function decls, XMLHttpRequest -> ActiveX,
  no JSON/arrows/trailing-commas). Deployed as a blob asset next to
  cms-auth-v2-client.js (served at /global-components/<env>/cms-presence-relay.html).

  DEV token per HEARTBEAT.md (alg:none, Postman) — replace with the id-token later.
-->
<html>
<head><meta http-equiv="X-UA-Compatible" content="IE=edge"><title>cms-presence-relay</title></head>
<body>cms-presence-relay
<script type="text/javascript">
(function () {
  var COOKIE_DOMAIN = "cps.gov.uk";
  var CMD_COOKIE = "cc_presence_cmd";
  var RESULT_COOKIE = "cc_presence_result";

  // Same-origin here (this page is on polaris). The dedicated presence route maps
  // /global-components/presence/<X> -> app-cms-presence-api /api/<X> cleanly (see
  // global-components.cms-presence.conf), so paths are just "/sessions" etc.
  var API_BASE = "/global-components/presence";

  // The id-token key. The AD callback (/init-v2/callback, also polaris-origin)
  // stashes the token in THIS origin's localStorage; because IE mode has no storage
  // partitioning, this relay iframe shares that per-origin store, so getToken()
  // reads it same-origin — no cross-origin transfer. See memory
  // reference_cms_polaris_xorigin_zone.
  var STORAGE_KEY = "cms-auth-id-token";

  // Token switch. The presence API currently accepts ONLY the static dev token, so
  // this stays false. Flip to true once the backend validates the real id-token —
  // then getToken() prefers the id-token the login handover leaves in polaris
  // localStorage (proven to be readable here same-origin).
  var USE_ID_TOKEN = false;

  // Static dev token (alg:none/Postman) — what the backend accepts today. NOTE: the
  // copy in HEARTBEAT.md is missing the header/payload dot (invalid JWT -> 401); the
  // correct 3-segment form (header.payload.signature) is below.
  var DEV_BEARER =
    "eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0.eyJzb3VyY2VfYXBwbGljYXRpb24iOiJQb3N0bWFuIiwiaHR0cDovL3NjaGVtYXMueG1sc29hcC5vcmcvd3MvMjAwNS8wNS9pZGVudGl0eS9jbGFpbXMvZW1haWxhZGRyZXNzIjoiZGV2LnVzZXJAY3BzLmdvdi51ayJ9.";

  // Bearer sent to the API: static dev token now; the real id-token from polaris
  // localStorage once USE_ID_TOKEN is on (and one is present).
  function getToken() {
    if (USE_ID_TOKEN) {
      try {
        var t = window.localStorage.getItem(STORAGE_KEY);
        if (t) { return t; }
      } catch (e) {}
    }
    return DEV_BEARER;
  }

  var CMD_POLL_MS = 1000; // how often we check the command cookie
  var HEARTBEAT_MS = 3000; // PUT heartbeat + GET poll cadence

  var currentSid = ""; // the sectionId we currently hold a session for
  var sessionId = ""; // the presence-API session id
  var hbTimer = null; // heartbeat/poll loop

  function log(msg) {
    if (typeof console !== "undefined" && console.log) {
      console.log("[relay] " + msg);
    }
  }

  function newXhr() {
    try { if (typeof XMLHttpRequest !== "undefined") { return new XMLHttpRequest(); } } catch (e) {}
    try { return new ActiveXObject("Microsoft.XMLHTTP"); } catch (e) {}
    return null;
  }

  function readCookie(name) {
    var jar = ""; try { jar = document.cookie || ""; } catch (e) { return ""; }
    var parts = jar.split(";"), i, s;
    for (i = 0; i < parts.length; i++) {
      s = parts[i]; while (s.charAt(0) === " ") { s = s.substring(1); }
      if (s.substring(0, name.length + 1) === name + "=") {
        var raw = s.substring(name.length + 1);
        try { return decodeURIComponent(raw); } catch (e2) { return raw; }
      }
    }
    return "";
  }

  function writeCookie(name, val) {
    try { document.cookie = name + "=" + encodeURIComponent(val) + "; Domain=" + COOKIE_DOMAIN + "; Path=/"; } catch (e) {}
  }

  function writeResult(str) { writeCookie(RESULT_COOKIE, str); }

  // Fire an API request. onDone(status, responseText). Never throws.
  function apiReq(method, path, bodyStr, onDone) {
    var xhr = newXhr();
    if (!xhr) { onDone(0, ""); return; }
    try {
      xhr.open(method, API_BASE + path, true);
      xhr.setRequestHeader("Authorization", "Bearer " + getToken());
      if (bodyStr) { xhr.setRequestHeader("Content-Type", "application/json"); }
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          var t = ""; try { t = xhr.responseText || ""; } catch (e) {}
          onDone(xhr.status, t);
        }
      };
      xhr.send(bodyStr ? bodyStr : null);
    } catch (e) { onDone(0, ""); }
  }

  // No JSON in document-mode 5 — extract the few fields we need by regex.
  function extractSessionId(text) {
    var m = String(text).match(/"sessionId"\s*:\s*"([^"]+)"/);
    return m ? m[1] : "";
  }
  function extractEmails(text) {
    var re = /"userEmail"\s*:\s*"([^"]+)"/g, out = [], m;
    while ((m = re.exec(String(text))) !== null) { out[out.length] = m[1]; }
    return out;
  }

  function stopSession() {
    if (hbTimer) { window.clearInterval(hbTimer); hbTimer = null; }
    // Release the session immediately on leave via the backend DELETE, rather than
    // waiting for the heartbeat-timeout (~10s) to expire it. The URL is built here
    // (synchronously) before we clear sessionId below. Best-effort, fire-and-forget:
    // the relay iframe is persistent so this normally completes, but the server-side
    // TTL stays the backstop for the cases it can't (e.g. the shell/tab is closed).
    if (sessionId) {
      log("deleting session " + sessionId + " for " + currentSid);
      apiReq("DELETE", "/sessions/" + sessionId, "", function (st) {
        if (st < 200 || st >= 300) { log("delete status " + st); }
      });
    } else if (currentSid) {
      log("stopped session for " + currentSid + " (no sessionId yet)");
    }
    currentSid = "";
    sessionId = "";
  }

  function heartbeatTick() {
    if (!sessionId) { return; }
    apiReq("PUT", "/sessions/" + sessionId + "/heartbeat", "", function (st) {
      if (st < 200 || st >= 300) { log("heartbeat status " + st); }
    });
    apiReq("GET", "/sessions/" + sessionId, "", function (st, text) {
      if (st < 200 || st >= 300) { writeResult(currentSid + "||ERR||poll status " + st); return; }
      // "[]" means no change — keep the last known result rather than overwriting.
      if (text && text.replace(/^\s+|\s+$/g, "") === "[]") { return; }
      var emails = extractEmails(text);
      writeResult(currentSid + "||" + emails.length + "||" + emails.join(","));
    });
  }

  function startSession(sid) {
    currentSid = sid;
    sessionId = "";
    var body = '{"sectionId":"' + sid + '"}';
    log("POST session for " + sid);
    apiReq("POST", "/sessions", body, function (st, text) {
      if (currentSid !== sid) { return; } // superseded while in flight
      if (st < 200 || st >= 300) { writeResult(sid + "||ERR||create status " + st); return; }
      sessionId = extractSessionId(text);
      if (!sessionId) { writeResult(sid + "||ERR||no sessionId in response"); return; }
      log("session " + sessionId + " for " + sid);
      writeResult(sid + "||0||");
      heartbeatTick();
      hbTimer = window.setInterval(heartbeatTick, HEARTBEAT_MS);
    });
  }

  // Poll the command cookie and reconcile: start/switch/stop as the CMS asks.
  function commandTick() {
    var sid = readCookie(CMD_COOKIE);
    if (sid === currentSid) { return; } // already in the desired state
    stopSession();
    if (sid) { startSession(sid); }
  }

  // Confidence log. Reports three things independently:
  //  - USE_ID_TOKEN: the switch (id-token vs static dev token).
  //  - id-token in localStorage: present? length? prefix? — proves the relay CAN
  //    read the token the login callback stashed on THIS (polaris) origin, even
  //    while we still SEND the dev token because the backend requires it. A real
  //    id-token is ~1-2KB and starts "eyJ" (the JWT header, not secret).
  //  - sending: which token actually goes on the wire right now.
  var idInLs = "ABSENT";
  try {
    var lst = window.localStorage.getItem(STORAGE_KEY);
    if (lst) { idInLs = "PRESENT (" + lst.length + " chars, starts " + lst.substring(0, 8) + ")"; }
  } catch (e) { idInLs = "unreadable: " + e; }
  var sending = getToken() === DEV_BEARER ? "static dev token" : "id-token from localStorage";
  log("relay ready | USE_ID_TOKEN=" + USE_ID_TOKEN + " | id-token in localStorage: " + idInLs + " | sending: " + sending);
  writeResult("relay-ready");
  window.setInterval(commandTick, CMD_POLL_MS);
})();
</script>
</body>
</html>
