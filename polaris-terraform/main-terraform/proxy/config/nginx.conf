load_module modules/ngx_http_js_module.so;
user  nginx;
worker_processes  auto;

error_log  /dev/stderr debug;
pid        /var/run/nginx.pid;

events {
  worker_connections 2048;
}

http {
  log_format cms_log 'CMS-LOG: $remote_addr - $remote_user [$time_local] '
    '"$request" '
    '$status '
    '$body_bytes_sent '
    '$request_length '
    '$request_time '
    '$upstream_response_time '
    '$upstream_connect_time '
    '$upstream_header_time '
    '"$http_referer" '
    '"$upstream_addr" '
    '"CMS-USER-ID:$cookie_UID" '
    '"POLARIS-CORRELATION-ID:$http_polaris_correlation_id" '
    '"POLARIS-OPERATION-NAME:$http_polaris_operation_name" '
    '"POLARIS-OPERATION-VALUES:$http_polaris_operation_values"';

  limit_req_zone cmsproxy zone=cmsproxy:1m rate=${CMS_RATE_LIMIT};
  limit_req_zone cmsgateway zone=cmsgateway:1m rate=${CMS_RATE_LIMIT};
  limit_req_status 429;
  server_tokens off;
  # No js_import here: every njs module is imported by its own features/*.conf,
  # each under its own name. The shared CMS-env helper (features/common/cms-detection.js)
  # is a pure ESM module `import`ed by those feature modules — nginx never
  # references it directly, so it needs no js_import. (Each feature owns the getters
  # its conf js_sets, under its own nginx variable names, so no getter is shared and
  # none of it has to live centrally.)
  access_log  /dev/stdout;

  # Notes on proxy_pass:
  # 1) If the string passed to the proxy_pass directive DOES NOT have a slash in it: 
  #     location /foo/ {
  #         proxy_pass http://other-host; # WITHOUT A TRAILING SLASH
  #      }
  #     then http://host/foo/bar will direct to http://other-host/foo/bar (note /foo/ in path)

  #    If the string passed to the proxy_pass directive DOES have a slash in it: 
  #     location /foo/ {
  #         proxy_pass http://other-host/; # WITH A TRAILING SLASH
  #      }
  #     then http://host/foo/bar will direct to http://other-host/bar (note no /foo/ in path)
  # 2) By default proxy_pass will redirect incoming `location /foo` to incoming `location /foo/`
  merge_slashes off;
  server {
    resolver ${WEBSITE_DNS_SERVER} valid=30s;
    listen 80;
    server_name ${WEBSITE_HOSTNAME};
    proxy_request_buffering off;
    proxy_buffering off;
    merge_slashes off;
    large_client_header_buffers 4 32k;

    # Security headers — inherited by location blocks that do not define their own add_header directives
    # Note: Content-Security-Policy is NOT set here because the gateway middleware handles it with
    # swagger-aware logic (relaxed CSP for /swagger paths). Setting it at both layers would cause
    # browsers to enforce the most restrictive of the two, breaking Swagger UI.
    proxy_hide_header Server;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control "no-store" always;
    add_header Pragma "no-cache" always;

    set $ieaction '';
    if ( $http_x_internetexplorermodeconfigurable = 1) {
        set $ieaction "configurable+${ieaction}";
    }
    if ($http_x_internetexplorermodeconfigurable != 1) {
        set $ieaction "nonconfigurable+${ieaction}";
    }
    if ( $http_user_agent ~* Trident ) {
        set $ieaction "ie+${ieaction}";
    }
    if ( $http_user_agent !~* Trident ) {
        set $ieaction "nonie+${ieaction}";
    }


    # Feature 0 — health check. Kept inline (too small to merit its own include).
    location = / {
      add_header Content-Type text/plain;
      return 200 'Polaris Proxy is online';
    }

    location = /robots933456.txt {
      add_header Content-Type text/plain;
      return 200 'here';
    }

    # Every other location lives in features/*.conf (docs/PROXY.md §6), loaded in
    # alphabetical order — which is behaviourally irrelevant here: exact/prefix
    # locations match by specificity, and the only cross-file ordering hazard
    # (colliding regexes) is avoided by keeping ALL CMS regexes together in
    # features/cms-proxy.conf (§5). global-components.conf is just another file
    # in the fold (#FCT2-9318).
    include features/*.conf;
  }
}
